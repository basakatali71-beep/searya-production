<!doctype html>
<html lang="tr" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sayfa Bulunamadı | Searya</title>
  <link rel="icon" type="image/png" href="/public/searya-logo.png">
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #e9efff; background: radial-gradient(circle at 25% 10%, rgba(37, 99, 235, .24), transparent 32%), radial-gradient(circle at 80% 85%, rgba(255, 92, 72, .16), transparent 30%), #080c14; }
    main { width: min(560px, 100%); padding: 42px; text-align: center; border: 1px solid rgba(148, 163, 184, .16); border-radius: 28px; background: rgba(13, 19, 31, .88); box-shadow: 0 28px 80px rgba(0, 0, 0, .34); }
    img { width: 190px; max-width: 68%; height: auto; }
    strong { display: block; margin-top: 28px; color: #5b82ff; font-size: clamp(54px, 14vw, 86px); line-height: .9; }
    h1 { margin: 18px 0 10px; font-size: clamp(24px, 6vw, 34px); }
    p { margin: 0 auto 28px; max-width: 390px; color: #94a3b8; line-height: 1.6; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 22px; border-radius: 14px; color: white; text-decoration: none; font-weight: 800; background: linear-gradient(135deg, #315cff, #587cff); box-shadow: 0 12px 32px rgba(49, 92, 255, .28); }
    a:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <main>
    <img src="/src/assets/searya-logo.png" alt="Searya">
    <strong>404</strong>
    <h1>Bu sayfayı bulamadık</h1>
    <p>Bağlantı değişmiş veya sayfa kaldırılmış olabilir. Güncel proje ilanlarına ana sayfadan ulaşabilirsin.</p>
    <a href="/">Ana sayfaya dön</a>
  </main>
</body>
</html>
