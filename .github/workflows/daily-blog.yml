name: Refresh Searya Tools search indexing

on:
  schedule:
    - cron: '0 9,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: searya-tools-indexing
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate the current tools SEO surface
        run: npm run audit:seo
      - name: Submit every current sitemap URL to IndexNow
        env:
          PUBLIC_ORIGIN: https://searya.com
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: npm run indexnow:submit-sitemap
      - name: Refresh the tools sitemap in Google Search Console
        env:
          GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SEARCH_CONSOLE_SITE_URL: sc-domain:searya.com
          GOOGLE_SEARCH_CONSOLE_SITEMAP_URL: https://searya.com/sitemap.xml
        run: npm run google:submit-sitemap
